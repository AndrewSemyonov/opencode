name: Build OpenCode Linux Binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example opencode-v0.1.17
        required: true
        type: string
  push:
    branches:
      - dev
  check_suite:
    types:
      - requested

permissions:
  contents: write

concurrency:
  group: opencode-linux-release
  cancel-in-progress: false

jobs:
  build-linux-x64:
    if: github.event_name != 'check_suite' || (github.event.check_suite.head_branch == 'dev' && github.event.check_suite.app.name == 'Railway App')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event_name == 'check_suite' && github.event.check_suite.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          RELEASE_SHA: ${{ github.event_name == 'check_suite' && github.event.check_suite.head_sha || github.sha }}
        run: |
          git fetch --tags --force

          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
            if [[ ! "$TAG" =~ ^opencode-v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
              echo "Invalid release tag: $TAG" >&2
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Release tag does not exist: $TAG" >&2
              exit 1
            fi
            git checkout --detach "$TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#opencode-v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST="$(git tag -l 'opencode-v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ ! "$LATEST" =~ ^opencode-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Cannot resolve latest release tag" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          TAG="opencode-v${MAJOR}.${MINOR}.$((PATCH + 1))"
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
            PATCH="$((PATCH + 1))"
            TAG="opencode-v${MAJOR}.${MINOR}.$((PATCH + 1))"
          done
          if [[ ! "$TAG" =~ ^opencode-v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#opencode-v}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Build OpenCode binaries
        env:
          OPENCODE_VERSION: ${{ steps.release.outputs.version }}
        run: bun run --cwd packages/opencode build

      - name: Prepare linux-x64 release assets
        working-directory: packages/opencode
        run: |
          cp dist/opencode-linux-x64/bin/opencode ../../opencode-linux-x64
          cd ../..
          sha256sum ./opencode-linux-x64 | tee ./opencode-linux-x64.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          overwrite_files: true
          files: |
            opencode-linux-x64
            opencode-linux-x64.sha256
